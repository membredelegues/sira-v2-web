		let recu = 0, total = 0;
		Object.keys(GODOT_CONFIG.fileSizes).forEach(function (n) {
			const p = poids[n] || tailles[n];
			total += p;
			if (suivi[n]) recu += p * Math.min(1, suivi[n].recu / tailles[n]);
		});
		return [recu, total];
	};
	/* UN seul chargement (yahya, 2026-11-19 : plus d'écran noir « La Mecque se construit… » après
	 * Godot). Cette page reste affichée jusqu'à ce que le jeu soit prêt : téléchargement = 0 à 80 %
	 * de la barre, puis le jeu (scripts/chapitre1.gd, _page_chargement) envoie sa construction,
	 * 80 à 100 %. Le jeu la rappelle plus tard s'il doit encore attendre (reprise en ville). -1 = cacher. */
	let jeu = null, premier = true, cache = null;
	window.siraChargement = function (pct, txt) {
		const st = document.getElementById('status');
		if (!st) return;
		clearTimeout(cache);
		if (pct < 0) {
			window.siraBoiteNote('pret');
			jeu = null;
			premier = false;
			st.style.transition = 'opacity .45s ease';
			st.style.opacity = '0';
			st.style.pointerEvents = 'none';
			cache = setTimeout(function () { st.style.display = 'none'; }, 480);
			return;
		}
		jeu = pct;
		st.style.display = 'flex';
		st.style.opacity = '1';
		st.style.pointerEvents = 'auto';
		plein.style.width = (premier ? 80 + 0.2 * pct : pct).toFixed(1) + '%';
		texte.textContent = txt || 'Préparation…';
		note.textContent = '';
	};
	window.siraChargementVu = function () { return jeu !== null || !premier; };
	function afficher() {
		if (!texte.isConnected || jeu !== null || !premier || window.siraPauseOnglet) return;
		const pr = window.siraProgres();
		if (pr[1] <= 0) return;
		plein.style.width = (80 * pr[0] / pr[1]).toFixed(1) + '%';
		if (pr[0] >= pr[1]) {
			texte.textContent = 'Démarrage du jeu…';
			note.textContent = '';
		} else {
			texte.textContent = 'Téléchargement : ' + (pr[0] / 1e6).toFixed(0) + ' Mo sur ' + (pr[1] / 1e6).toFixed(0) + ' Mo';
			note.textContent = Date.now() - lent < 6000 ? 'Connexion lente… je reprends là où ça s\'est arrêté.' : '';
		}
	}
	setInterval(afficher, 250);

	function solide(url, nom, signalDehors) {
		const total = tailles[nom];
		const wasm = /\.wasm$/.test(nom);
		const st = suivi[nom] = { recu: 0, reprises: 0 };
		let lecteur = null, ctrl = null, sauter = 0, fini = false;
		if (signalDehors) signalDehors.addEventListener('abort', function () { fini = true; try { ctrl && ctrl.abort(); } catch (e) { /* rien */ } });

		async function ouvrir() {
			for (let essai = 0; !fini; essai++) {
				ctrl = new AbortController();
				const garde = setTimeout(function () { ctrl.abort(); }, 25000);
				try {
					const h = {};
					// Reprise par morceau. Le .wasm voyage compressé (10 Mo au lieu de 40) et une
					// reprise par morceau le ferait venir non compressé : on ne le fait que pour la fin.
					if (st.recu > 0 && (!wasm || total - st.recu < 8e6)) h.Range = 'bytes=' + st.recu + '-';
					const r = await vraiFetch(url, { headers: h, signal: ctrl.signal, cache: essai > 1 ? 'no-store' : 'default' });
					clearTimeout(garde);
					if (r.status === 404 || r.status === 410) {
						// Fichier remplacé par une publication plus récente : on recharge la page (une fois).
						let deja = 0;
						try { deja = +sessionStorage.getItem('sira404') || 0; sessionStorage.setItem('sira404', deja + 1); } catch (e) { /* rien */ }
						if (deja < 2) { location.replace('./?v=' + Date.now() + (location.search.includes('atelier') ? '&atelier' : '')); await pause(60000); }
						throw new Error('HTTP ' + r.status);
					}
					if (!r.ok) throw new Error('HTTP ' + r.status);
					sauter = r.status === 206 ? 0 : st.recu;
					lecteur = r.body.getReader();
					return;
				} catch (e) {
					clearTimeout(garde);
					if (fini) return;
					console.warn('SIRA téléchargement ' + nom + ' : ' + e + ' (nouvel essai)');
					lent = Date.now();
					await pause(Math.min(800 * (essai + 1), 4000));
				}
			}
		}
		function lire() {
			// Aucun octet pendant 15 s (25 s pour le .wasm) : la connexion est tombée, on coupe et on reprend.
			return new Promise(function (ok, ko) {
				const garde = setTimeout(function () { ko(new Error('plus rien ne vient')); }, wasm ? 25000 : 15000);
				lecteur.read().then(function (x) { clearTimeout(garde); ok(x); }, function (e) { clearTimeout(garde); ko(e); });
			});
		}
		const flux = new ReadableStream({
			async pull(c) {
				while (!fini) {
					if (!lecteur) await ouvrir();
					if (fini) break;
					try {
						const x = await lire();
						if (x.done) {
							if (st.recu >= total) { fini = true; c.close(); return; }
							throw new Error('fichier incomplet');
						}
						let v = x.value;
						if (sauter > 0) {
							const k = Math.min(sauter, v.length);
							sauter -= k;
							v = v.subarray(k);
							if (!v.length) continue;
						}
						st.recu += v.length;
						c.enqueue(v);
						return;
					} catch (e) {
						if (fini) break;
						console.warn('SIRA téléchargement ' + nom + ' interrompu à ' + st.recu + ' / ' + total + ' : ' + e);
						try { ctrl.abort(); } catch (e2) { /* rien */ }
						lecteur = null;
						st.reprises++;
						lent = Date.now();
						await pause(500);
					}
				}
				c.error(new DOMException('arrêté', 'AbortError'));
			},
			cancel() { fini = true; try { ctrl && ctrl.abort(); } catch (e) { /* rien */ } },
		});
		return new Response(flux, { status: 200, headers: { 'Content-Type': wasm ? 'application/wasm' : 'application/octet-stream', 'Content-Length': String(total) } });
	}

	/* Réserve du navigateur (Cache Storage) : le moteur et le paquet de départ, une fois reçus
	 * en entier, y sont rangés sous leur nom. À la visite suivante ils en sortent sans réseau.
	 * (Le 2e paquet est déjà gardé par le jeu dans user://, voir _paquet_ville.) */
	const RESERVE = 'sira-fichiers-1';
	const garder = {};
	Object.keys(GODOT_CONFIG.fileSizes).forEach(function (n) { garder[n] = true; });
	if (window.SIRA_CAMP) garder[window.SIRA_CAMP] = true;   // le campement, téléchargé juste après le départ
	if (window.SIRA_CAMP_LEGER) garder[window.SIRA_CAMP_LEGER] = true;
	const reserve = ('caches' in window) ? caches.open(RESERVE).catch(function () { return null; }) : Promise.resolve(null);
	reserve.then(function (c) {
		// Ménage : les fichiers des anciennes versions sortent de la réserve.
		if (c) c.keys().then(function (ks) { ks.forEach(function (k) { if (!garder[decodeURIComponent(k.url.split('/').pop())]) c.delete(k); }); });
	});
	function depuisReserve(nom) {
		if (!garder[nom]) return Promise.resolve(null);
		return reserve.then(function (c) {
			return c ? c.match(nom) : null;
		}).then(function (r) {
			if (!r || +r.headers.get('X-Sira-Taille') !== tailles[nom]) return null;
			suivi[nom] = { recu: tailles[nom], reprises: 0, reserve: true };
			console.log('SIRA ' + nom + ' : déjà dans le téléphone');
			return r;
		}).catch(function () { return null; });
	}
	function versReserve(nom, rep) {
		// Copie du flux : une branche pour le moteur, l'autre rangée dans la réserve si elle est complète.
		if (!garder[nom] || !rep.body || !rep.body.tee) return rep;
		const deux = rep.body.tee();
		const type = rep.headers.get('Content-Type');
		new Response(deux[1]).blob().then(function (b) {
			if (b.size !== tailles[nom]) return null;
			return reserve.then(function (c) {
				return c && c.put(nom, new Response(b, { headers: { 'Content-Type': type, 'Content-Length': String(b.size), 'X-Sira-Taille': String(b.size) } }));
			});
		}).catch(function (e) { console.warn('SIRA réserve ' + nom + ' : ' + e); });
		return new Response(deux[0], { status: 200, headers: rep.headers });
	}

	/* Débit réellement mesuré pendant le départ (Mbit/s), 0 si tout venait de la réserve. */
	window.siraDebit = function () {
		let o = 0;
		Object.keys(GODOT_CONFIG.fileSizes).forEach(function (n) { if (suivi[n] && !suivi[n].reserve) o += (poids[n] || tailles[n]) * Math.min(1, suivi[n].recu / tailles[n]); });
		const s = (performance.now() - debut) / 1000;
		return o > 2e6 && s > 1 ? o * 8 / 1e6 / s : 0;
	};
	window.siraSolide = true;
	window.siraSuivi = function (nom) { return suivi[nom]; };
	window.fetch = function (res, init) {
		try {
			const url = typeof res === 'string' ? res : (res && res.url) || '';
			const nom = decodeURIComponent(url.split('?')[0].split('#')[0].split('/').pop());
			if (tailles[nom] > 0 && /\.(wasm|pck)$/.test(nom) && typeof ReadableStream === 'function') {
				return depuisReserve(nom).then(function (r) { return r || versReserve(nom, solide(url, nom, init && init.signal)); });
			}
		} catch (e) { /* téléchargement normal */ }
		return vraiFetch(res, init);
	};
}());

const engine = new Engine(GODOT_CONFIG);
(function () {
	const statut = document.getElementById('status');
	function echec(err) {
		console.error(err);
		const msg = (err && err.message) || String(err);
		document.getElementById('sira-texte').textContent = 'Le jeu n\'a pas pu démarrer.';
		document.getElementById('sira-note').textContent = msg + ' Touche l\'écran pour réessayer.';
		statut.addEventListener('pointerdown', function () { location.reload(); });
	}
	const manque = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (manque.length !== 0) {
		echec(new Error('Ce navigateur ne peut pas lancer le jeu (' + manque.join(', ') + '). Ouvre le lien dans Chrome ou Safari.'));
		return;
	}
	/* UN SEUL onglet du jeu à la fois (2026-11-21, PC de yahya : deux jeux ouverts = la carte
	 * graphique et la mémoire partagées en deux, tout rame, même une page vide). Le dernier ouvert
	 * gagne : les autres onglets s'arrêtent net (le moteur n'est plus chargé) et attendent un toucher. */
	const ici = location.search.replace(/^\?/, '').split('&').filter(function (a) { return a && a !== 'pause'; });
	const lienIci = location.pathname + (ici.length ? '?' + ici.join('&') : '') + location.hash;
	if (/(^|[?&])pause(&|$)/.test(location.search)) {
		window.siraPauseOnglet = true;
		document.getElementById('sira-texte').textContent = 'Sira est ouvert dans un autre onglet.';
		document.getElementById('sira-note').textContent = 'Touche l\'écran pour jouer ici.';
		document.getElementById('sira-barre').style.display = 'none';
		statut.addEventListener('pointerdown', function () { location.replace(lienIci); });
		return;
	}
	try {
		const canal = new BroadcastChannel('sira-un-seul-onglet');
		const moi = String(Date.now()) + Math.random();
		canal.onmessage = function (e) {
			if (!e.data || e.data.ouvert === moi) return;
			canal.close();
			location.replace(lienIci.replace(/^([^?#]*)(\?[^#]*)?/, function (m, a, q) { return a + (q ? q + '&pause' : '?pause'); }));
		};
		canal.postMessage({ ouvert: moi });
	} catch (e) { /* vieux navigateur : rien */ }
	// Comme engine.startGame(), plus la tente du réveil déposée sous le nom « sira-tente.pck ».
	const exe = GODOT_CONFIG.executable;
	const pack = window.SIRA_PCK || (exe + '.pck');
	const attente = [engine.init(exe), engine.preloadFile(pack, pack)];
	if (window.SIRA_TENTE) attente.push(engine.preloadFile(window.SIRA_TENTE, 'sira-tente.pck'));
	Promise.all(attente).then(function () {
		campement();
		return engine.start({ args: ['--main-pack', pack].concat(GODOT_CONFIG.args || []) });
	}).then(function () {
		// La page reste jusqu'à ce que le jeu dise qu'il est prêt (siraChargement(-1)). Filet : si le
		// jeu ne l'a jamais appelée au bout de 20 s (autre scène), on la cache quand même.
		setTimeout(function () { if (!window.siraChargementVu()) window.siraChargement(-1); }, 20000);
	}, echec);

	// Le campement : téléchargé dès que le départ est arrivé, pendant que le jeu démarre et que
	// l'enfant se réveille sous la tente. Le jeu regarde window.siraCamp (chapitre1.gd, _paquet_camp).
	/* Paquets légers (images deux fois plus petites) pour les appareils faibles et les connexions
	 * lentes : choisis une fois par version des décors (sinon on téléchargerait les deux). */
	function paquets() {
		const a = window.siraAppareil || {};
		if (!window.SIRA_CAMP_LEGER || !window.SIRA_VILLE_LEGER) return;
		let leger = null;
		try { const v = JSON.parse(localStorage.getItem('sira-paquets2') || 'null'); if (v && v.e === window.SIRA_CAMP) leger = !!v.leger; } catch (e) { /* rien */ }
		if (leger === null) {
			const d = window.siraDebit();
			a.debit_mesure = +d.toFixed(1);
			leger = (a.mem > 0 && a.mem <= 2) || a.eco || /2g|3g/.test(a.reseau) || (d > 0 && d < 2.5);
		}
		if (a.leger_force) leger = a.leger_force === '1';
		try { localStorage.setItem('sira-paquets2', JSON.stringify({ e: window.SIRA_CAMP, leger: leger })); } catch (e) { /* rien */ }
		a.leger = leger;
		console.log('SIRA paquets ' + (leger ? 'légers' : 'normaux') + ' (débit mesuré ' + (a.debit_mesure || 0) + ' Mbit/s)');
		if (leger) { window.SIRA_CAMP = window.SIRA_CAMP_LEGER; window.SIRA_VILLE = window.SIRA_VILLE_LEGER; }
	}
	function campement() {
		paquets();
		const nom = window.SIRA_CAMP;
		if (!nom) return;
		const d = window.siraCamp = { recu: 0, total: (window.SIRA_TAILLES || {})[nom] || 0, pret: false };
		const suivre = setInterval(function () { const p = window.siraSuivi && window.siraSuivi(nom); if (p) d.recu = p.recu; }, 200);
		(function essai(n) {
			fetch(nom).then(function (r) {
				if (!r.ok) throw new Error('HTTP ' + r.status);
				return r.arrayBuffer();
			}).then(function (buf) {
				engine.copyToFS('sira-camp.pck', buf);
				clearInterval(suivre);
				d.recu = d.total;
				d.pret = true;
				console.log('SIRA campement arrivé (' + (buf.byteLength / 1e6).toFixed(0) + ' Mo)');
			}).catch(function (e) {
				console.warn('SIRA campement : ' + e + ' (nouvel essai)');
				setTimeout(function () { essai(n + 1); }, Math.min(1000 * (n + 1), 8000));
			});
		}(0));
	}
}());
		</script>
	</body>
